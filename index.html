<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CIRO Energy — scroll experience</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=Archivo+Black&display=swap">
<style>
:root{--bg:#050507;--fg:#f4f2f7;--mute:#a7a3b5;--g:#6a5cff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050507;--fg:#f4f2f7}}
:root[data-theme="dark"]{--bg:#050507;--fg:#f4f2f7}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font:500 15px/1.5 Archivo,system-ui,sans-serif;overflow-x:hidden}
header{position:fixed;top:0;left:0;right:0;z-index:9;display:flex;justify-content:space-between;align-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 22px 0}
.logo{font:italic 400 24px/.85 'Archivo Black',Impact,sans-serif;letter-spacing:-1px;text-align:center;position:absolute;left:50%;transform:translateX(-50%)}
.logo small{display:block;font-size:10px;letter-spacing:0}
header button{background:#f4f2f7;color:#000;border:0;border-radius:6px;padding:8px 14px;font:700 11px/1 Archivo,sans-serif;letter-spacing:.12em;margin-left:auto;cursor:pointer}
.sticky{position:sticky;top:0;height:100svh;min-height:560px;overflow:hidden}
.floor{position:absolute;inset:24% 4% 0;background:linear-gradient(165deg,#a3a3a8,#3a3a3f 55%,#08080a);clip-path:polygon(0 0,100% 10%,100% 100%,0 100%)}
.glow{position:absolute;inset:0;background:radial-gradient(ellipse 60% 30% at 50% 100%,var(--g),transparent 70%);opacity:.8;transition:background .6s}
.car,.wv{position:absolute;inset:0;perspective:1100px;touch-action:pan-y}
.car{top:-4%}
.can{position:absolute;left:50%;top:50%;width:86px;height:220px;margin:-110px 0 0 -43px;border-radius:12px/9px;background:linear-gradient(90deg,#000b 0,#0000 20%,#fff7 38%,#0000 58%,#000a 100%),linear-gradient(var(--a),var(--b));box-shadow:0 30px 50px #0008;will-change:transform}
.can span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);font:italic 400 52px/1 'Archivo Black',Impact,sans-serif;letter-spacing:-3px;color:#fff;text-shadow:0 0 8px #0006}
.can em{position:absolute;left:0;right:0;bottom:9px;text-align:center;font:italic 700 9px/1 Archivo,sans-serif;color:#fffc}
.rim{position:absolute;left:0;right:0;height:14px;border-radius:50%;background:linear-gradient(90deg,#777,#eee 40%,#888)}
.rim.t{top:-7px}.rim.b{bottom:-7px;filter:brightness(.7)}
.arr{position:absolute;top:46%;z-index:3;background:none;border:0;color:var(--fg);font-size:28px;cursor:pointer;opacity:.7;padding:12px}
.arr:hover{opacity:1}#prev{left:calc(50% - 130px)}#next{right:calc(50% - 130px)}
#name{position:absolute;left:0;right:0;bottom:17%;text-align:center;font:italic 400 clamp(22px,4vw,34px)/1 'Archivo Black',Impact,sans-serif;text-transform:uppercase;letter-spacing:-.5px}
.bar{position:absolute;left:50%;bottom:11%;width:min(300px,60vw);height:2px;transform:translateX(-50%);background:linear-gradient(90deg,#9b8cff,#ff7ad9)}
.bar i{position:absolute;top:-4px;width:10px;height:10px;border-radius:50%;background:#c9b8ff;margin-left:-5px}
.hint{position:absolute;left:0;right:0;bottom:7%;text-align:center;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
#story{height:480vh}
#story .sticky{background:radial-gradient(ellipse 75% 85% at 50% 75%,#ff2bd6 0,#8a0c78 50%,#08020a 100%)}
.copy{position:absolute;left:8%;top:38%;max-width:340px}
.copy b{display:block;width:70px;height:9px;background:#fff;margin-bottom:18px}
.copy h3{font:italic 400 30px/1 'Archivo Black',Impact,sans-serif;text-transform:uppercase;margin-bottom:12px}
.copy p{font-size:14px;color:#f6e4f4}
.copy.in{animation:in .5s both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.dots{position:absolute;right:4%;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px}
.dots button{width:30px;height:30px;border-radius:50%;border:1px solid #fff8;background:none;color:#fff;font:700 11px/1 Archivo,sans-serif;cursor:pointer}
.dots button.on{background:#fff;color:#8a0c78}
#wave{height:340vh}
#wave .sticky{background:linear-gradient(180deg,#050507,#2b2b30 60%,#8c8c92)}
.ttl{position:absolute;left:8%;top:20%;font:italic 400 clamp(26px,5vw,48px)/1 'Archivo Black',Impact,sans-serif;text-transform:uppercase;z-index:2}
footer{height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:0 20px}
footer h2{font:italic 400 clamp(28px,6vw,56px)/1 'Archivo Black',Impact,sans-serif;text-transform:uppercase}
.cta{background:#f4f2f7;color:#000;text-decoration:none;font-weight:700;letter-spacing:.1em;font-size:12px;text-transform:uppercase;padding:14px 26px;border-radius:8px}
@media(max-width:700px){.copy{left:20px;right:20px;top:auto;bottom:10%}.dots{right:10px}#prev{left:8px}#next{right:8px}}
</style></head><body>
<header><span class="logo">CIRO<small>ENERGY</small></span><button type="button">MENU</button></header>
<section id="hero" class="sticky"><div class="floor"></div><div class="glow"></div>
<div class="car" id="car"></div>
<button class="arr" id="prev" aria-label="Précédent">‹</button><button class="arr" id="next" aria-label="Suivant">›</button>
<h2 id="name"></h2><div class="bar"><i id="dot"></i></div><p class="hint">Scrollez pour découvrir</p></section>
<section id="story"><div class="sticky"><div class="can" id="sbig" style="left:62%"></div>
<div class="copy in" id="copy"><b></b><h3 id="ct"></h3><p id="cp"></p></div>
<div class="dots" id="dots"></div></div></section>
<section id="wave"><div class="sticky"><h2 class="ttl">Toute<br>la gamme</h2><div class="wv" id="wv"></div></div></section>
<footer><h2>Goûte l'énergie</h2><a class="cta" href="#hero">Trouver une canette</a></footer>
<script>
const F=[["Double Litchi","#5a4bf0","#16114f","#6a5cff"],["Pomme Rhubarbe","#ff5fd8","#7a0f66","#ff4fd8"],["Fraise","#ff4a5e","#6e0f1c","#ff4a5e"],["Orange","#ff8a3d","#6b2a08","#ff8a3d"],["Menthe","#2fd3a0","#08422f","#2fd3a0"],["Myrtille","#3b8cff","#0b2a66","#3b8cff"],["Noir","#454552","#0a0a0e","#8a8a99"]];
const S=[["Arômes naturels","Pour leur puissance aromatique et leur richesse gustative, on a soigneusement sélectionné des arômes naturels issus de fruits et de plantes."],["Moins de sucre","Une recette allégée en sucres, pour garder le plaisir sans le coup de mou qui suit."],["Stévia","Pour compléter le sucre de canne et apporter douceur et gourmandise, on a choisi d'ajouter un édulcorant d'origine végétale avec des extraits de stévia."],["Caféine naturelle","Une caféine issue de grains de café, pour un boost franc et progressif."]];
const $=s=>document.querySelector(s);
const mk=(f,p)=>{const c=document.createElement('div');c.className='can';c.style.setProperty('--a',f[1]);c.style.setProperty('--b',f[2]);c.innerHTML='<i class="rim t"></i><span>CIRO</span><em>ENERGY</em><i class="rim b"></i>';p.append(c);return c};
const N=F.length,hc=F.map(f=>mk(f,$('#car'))),wc=Array.from({length:12},(_,i)=>mk(F[i%N],$('#wv'))),sb=$('#sbig');
sb.style.setProperty('--a','#ff5fd8');sb.style.setProperty('--b','#2a0626');sb.innerHTML='<i class="rim t"></i><span>CIRO</span><em>ENERGY</em><i class="rim b"></i>';
let tgt=2,cur=2,last=-1,si=-1;
const go=n=>{tgt=Math.max(0,Math.min(N-1,n))},r=()=>Math.round(tgt);
$('#prev').onclick=()=>go(r()-1);$('#next').onclick=()=>go(r()+1);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(r()-1);if(e.key==='ArrowRight')go(r()+1)});
let sx=null;$('#car').onpointerdown=e=>sx=e.clientX;
addEventListener('pointerup',e=>{if(sx!==null){const d=e.clientX-sx;if(Math.abs(d)>40)go(r()+(d<0?1:-1));sx=null}});
const st=$('#story'),dots=S.map((_,i)=>{const b=document.createElement('button');b.type='button';b.textContent=i+1;b.onclick=()=>scrollTo({top:st.offsetTop+(i+.5)/4*(st.offsetHeight-innerHeight),behavior:'smooth'});$('#dots').append(b);return b});
const prog=e=>{const q=e.getBoundingClientRect();return Math.min(1,Math.max(0,-q.top/(q.height-innerHeight)))};
function tick(t){
 const k=innerWidth<700?.6:1;cur+=(tgt-cur)*.1;
 hc.forEach((c,i)=>{const d=i-cur,a=Math.abs(d);c.style.transform=`translate3d(${d*150*k}px,${Math.sin(t/800+i)*6}px,${-a*130}px) rotateY(${-d*16}deg) rotateZ(${-6-d*3}deg) scale(${1+Math.max(0,1-a)*.3})`;c.style.filter=`brightness(${1-Math.min(a,1)*.6})`});
 const n=Math.round(cur);if(n!==last){last=n;$('#name').textContent=F[n][0];$('#hero').style.setProperty('--g',F[n][3])}
 $('#dot').style.left=cur/(N-1)*100+'%';
 const p=prog(st),i=Math.min(3,Math.floor(p*4));
 sb.style.transform=`rotateZ(${-8+p*16}deg) scale(${1.5+p*.4}) translateY(${Math.sin(t/900)*8}px)`;
 if(i!==si){si=i;$('#ct').textContent=S[i][0];$('#cp').textContent=S[i][1];dots.forEach((d,j)=>d.classList.toggle('on',j===i));const c=$('#copy');c.classList.remove('in');void c.offsetWidth;c.classList.add('in')}
 const q=prog($('#wave'));
 wc.forEach((c,i)=>{const m=i-5.5,ph=i*.7+q*8;c.style.transform=`translate3d(${m*95*k-q*140*k}px,${Math.sin(ph)*80}px,${-Math.abs(m)*25}px) rotateX(-58deg) rotateZ(${Math.cos(ph)*20+10}deg)`});
 requestAnimationFrame(tick)}
requestAnimationFrame(tick);
</script></body></html>
